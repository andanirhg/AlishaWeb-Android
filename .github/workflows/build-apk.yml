name: Build AlishaWeb APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf android-project
          AlishaWeb-V74-VPS-6-CARDS-HERO.zip
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-project
        run: gradle assembleDebug

      - name: Siapkan APK
        run: |
          APK=$(find android-project/app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK" AlishaWeb.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlishaWeb-APK
          path: AlishaWeb.apk

      - name: Update Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: AlishaWeb APK v1.0.0
          files: AlishaWeb.apk
          overwrite_files: true
